name: Release DBX plugin

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    uses: t8y2/dbx/.github/workflows/plugin-release-reusable.yml@main
    with:
      release-tag: ${{ github.event.release.tag_name }}
      package-command: npm ci && npm run build && dbx-plugin package .
      package-path: dist/*.dbxp
      metadata-path: dist/*.artifact.json
      plugin-cli-version: 0.1.9
      build-matrix: '{"include":[{"runner":"ubuntu-24.04","target":"linux-x64"},{"runner":"ubuntu-24.04-arm","target":"linux-arm64"},{"runner":"macos-15","target":"darwin-arm64"},{"runner":"macos-15-intel","target":"darwin-x64"},{"runner":"windows-2025","target":"windows-x64"},{"runner":"windows-11-arm","target":"windows-arm64"}]}'
